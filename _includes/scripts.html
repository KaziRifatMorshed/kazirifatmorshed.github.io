<script>
    function showAsideBar() {
        var _aside_bar_ = document.getElementById("aside_bar");
        var _btn_ = document.getElementById("ShortcutsNavigationBar");
        var isHidden = _aside_bar_.style.visibility === "hidden" || window.getComputedStyle(_aside_bar_).visibility === "hidden";
        if (isHidden) {
            _aside_bar_.style.visibility = "visible";
            if (_btn_) _btn_.setAttribute("aria-expanded", "true");
        } else {
            _aside_bar_.style.visibility = "hidden";
            if (_btn_) _btn_.setAttribute("aria-expanded", "false");
        }
    }
</script>
<script>
    function showBG() {
        var _bg_ = document.getElementById("main_");
        var _btn_ = document.getElementById("ShowBG");
        var isVisible = _bg_.style.visibility === "visible" || window.getComputedStyle(_bg_).visibility === "visible";
        if (isVisible) {
            _bg_.style.visibility = "hidden";
            if (_btn_) _btn_.setAttribute("aria-pressed", "true");
        } else {
            _bg_.style.visibility = "visible";
            if (_btn_) _btn_.setAttribute("aria-pressed", "false");
        }
    }
</script>
